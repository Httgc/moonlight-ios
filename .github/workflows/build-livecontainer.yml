name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch: # 支持你在网页端手动点击按钮触发打包

jobs:
  build:
    runs-on: macos-14 # 使用更高性能的 macOS 14 虚拟机架构
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 必须包含子模块，Moonlight 深度依赖依赖库

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app # 使用兼容的 Xcode 版本

      - name: Build Archive (Unsigned)
        run: |
          # 编译成未签名的 xcarchive 文件
          xcodebuild -project Moonlight.xcodeproj \
                     -scheme "Moonlight iOS" \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package Payload to IPA
        run: |
          # 建立标准 IPA 内部的 Payload 目录结构
          mkdir -p Payload
          
          # 将编译好的 .app 文件移动到 Payload 文件夹中
          cp -r build/Build/Products/Release-iphoneos/Moonlight.app Payload/
          
          # 压缩为扩展名为 .ipa 的未签名安装包
          zip -r Moonlight_LiveContainer.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-LiveContainer-IPA
          path: Moonlight_LiveContainer.ipa
