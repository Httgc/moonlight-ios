name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch: # 支持手动点击按钮触发打包

jobs:
  build:
    runs-on: macos-13 # 切换到更稳定的 macos-13 环境，兼容性更好
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 确保完整拉取所有子模块

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_14.3.1.app # 使用更匹配该源码时期的 Xcode 版本

      - name: Clean and Build Project (Unsigned)
        run: |
          # 清理并开始编译，强制跳过签名限制
          xcodebuild clean build \
                     -project Moonlight.xcodeproj \
                     -scheme "Moonlight iOS" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload to IPA
        run: |
          # 创建标准的 IPA 目录结构
          mkdir -p Payload
          
          # 寻找编译出的 .app 并复制到 Payload 文件夹
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到编译生成的 .app 文件！"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          
          # 打包成未签名的 ipa
          zip -r Moonlight_LiveContainer.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-LiveContainer-IPA
          path: Moonlight_LiveContainer.ipa
