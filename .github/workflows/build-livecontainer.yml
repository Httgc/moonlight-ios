name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch: # 支持手动点击按钮触发打包

jobs:
  build:
    runs-on: macos-14 # 使用最新的系统环境
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 完整拉取子模块

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Project (Unsigned)
        run: |
          # 使用死锁的目标 Scheme 名 "Moonlight" 进行无签名编译
          xcodebuild clean build \
                     -project Moonlight.xcodeproj \
                     -scheme "Moonlight" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          
          # 寻找编译出的 .app 并复制到 Payload 文件夹
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到编译生成的 .app 文件！"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r Moonlight_LiveContainer.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-LiveContainer-IPA
          path: Moonlight_LiveContainer.ipa
