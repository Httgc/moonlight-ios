name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch: # 支持手动点击按钮触发打包

jobs:
  build:
    runs-on: macos-14 # 恢复到最新系统环境
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 完整拉取子模块

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Auto-Detect Scheme and Build
        run: |
          # 1. 自动列出并检测项目中包含 ios 关键字的有效 Scheme
          echo "=== 正在检测项目支持的编译方案 ==="
          xcodebuild -list -project Moonlight.xcodeproj
          
          # 自动寻找包含 "iOS" 或 "Moonlight" 的 Scheme，如果找不到则默认用第一个
          SCHEME_NAME=$(xcodebuild -list -project Moonlight.xcodeproj | grep -E "Moonlight|iOS" | sed 's/^[[:space:]]*//' | head -n 1)
          
          if [ -z "$SCHEME_NAME" ]; then
            # 保底方案：取 Targets 列表下的第一个
            SCHEME_NAME=$(xcodebuild -list -project Moonlight.xcodeproj | awk '/Targets:/,/Build Configurations:/{if($0!~/Targets:/&&$0!~/Build Configurations:/) print}' | sed 's/^[[:space:]]*//' | head -n 1)
          fi
          
          echo "=== 最终决定使用的 Scheme 名字为: [$SCHEME_NAME] ==="

          # 2. 执行跳过签名的全自动编译
          xcodebuild clean build \
                     -project Moonlight.xcodeproj \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          
          # 寻找编译出的 .app 并复制到 Payload 文件夹
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到编译生成的 .app 文件！"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r Moonlight_LiveContainer.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-LiveContainer-IPA
          path: Moonlight_LiveContainer.ipa
